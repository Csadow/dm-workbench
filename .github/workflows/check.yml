name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Domain and backup tests
        run: node --test tests/*.test.mjs
      - name: Browser and offline scenarios
        env:
          CHROMIUM: google-chrome
        run: node scripts/browser-test.mjs
      - name: Install desktop runtime
        run: |
          npm install --global pnpm@11.26.0
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Desktop and restart scenarios
        env:
          DMW_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a node scripts/test-desktop.mjs
      - name: Package and verify standalone Linux application
        env:
          DMW_TEST_NO_SANDBOX: '1'
        run: |
          node scripts/package-desktop.mjs
          DMW_TEST_BINARY="$PWD/dist/DM-Workbench-0.7.0-linux-x64/dm-workbench" xvfb-run -a node scripts/test-desktop.mjs
